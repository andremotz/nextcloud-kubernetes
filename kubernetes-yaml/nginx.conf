# Kubernetes proxy-config
#
# used for adding https security
# written for nginx 1.30 (see image in proxy-pod.yaml)

user  www-data;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    keepalive_timeout  65;

    server {
        listen 80;
        server_name <my-server-name>;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name <my-server-name>;
        access_log  /var/log/nginx/access.log;

        ssl_certificate /etc/nginx/certs/<my-server-name>.crt;
        ssl_certificate_key /etc/nginx/certs/<my-server-name>.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

        # Must be at least PHP_UPLOAD_LIMIT in nc-deployment.yaml
        # (nginx's default of 1m rejects larger uploads with 413).
        client_max_body_size 4G;

        # CalDAV/CardDAV auto-discovery; Nextcloud's own redirect does not
        # work behind a reverse proxy.
        location = /.well-known/carddav {
            return 301 https://$host/remote.php/dav/;
        }
        location = /.well-known/caldav {
            return 301 https://$host/remote.php/dav/;
        }

        location / {
            proxy_pass http://nc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Large uploads and long-running requests.
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
