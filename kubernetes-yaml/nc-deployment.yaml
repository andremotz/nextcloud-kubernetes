apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nc
  name: nc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nc
  template:
    metadata:
      labels:
        app: nc
    spec:
      containers:
      - env:
        - name: TZ
          value: Europe/Berlin
        - name: NEXTCLOUD_ADMIN_USER
          value: admin
        - name: NEXTCLOUD_ADMIN_PASSWORD
          value: <someNextCloudAdminPass>
        # Hostname users type into the browser (same as SSL_SUBJECT and
        # server_name). Space-separated if there is more than one.
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: <my-server-name>

        # TLS ends at the nginx proxy; tell Nextcloud the public URL is https.
        - name: OVERWRITEPROTOCOL
          value: https
        - name: OVERWRITECLIURL
          value: https://<my-server-name>
        # Pod network of the cluster (the --pod-network-cidr given to
        # kubeadm init), so the client IP is taken from X-Forwarded-For.
        - name: TRUSTED_PROXIES
          value: 10.244.0.0/16

        # Maximum upload size. nginx.conf limits the request size, so Apache
        # does not need a limit of its own (its default is 1 GiB).
        - name: PHP_UPLOAD_LIMIT
          value: 4G
        - name: APACHE_BODY_LIMIT
          value: "0"

        - name: MYSQL_DATABASE
          value: nextcloud
        - name: MYSQL_HOST
          value: db
        - name: MYSQL_PASSWORD
          value: <someMysqlPass>
        - name: MYSQL_USER
          value: nextcloud
        name: nc
        image: nextcloud:34.0.6-apache
        ports:
        - containerPort: 80
          protocol: TCP
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/www/html
          name: html
      restartPolicy: Always
      volumes:
        - name: html
          hostPath:
            path: "/home/<someFolderLocation>/nc-pv"


