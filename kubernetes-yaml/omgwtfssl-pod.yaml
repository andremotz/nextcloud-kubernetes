apiVersion: v1
kind: Pod
metadata:
  labels:
    app: omgwtfssl
  name: omgwtfssl
spec:
  restartPolicy: Never
  containers:
  - env:
    - name: SSL_SUBJECT
      value: <my-server-name>
    - name: CA_SUBJECT
      value: <my-email>
    - name: SSL_KEY
      value: /certs/<my-server-name>.key
    - name: SSL_CSR
      value: /certs/<my-server-name>.csr
    - name: SSL_CERT
      value: /certs/<my-server-name>.crt
    name: omgwtfssl
    # Unmaintained since 2021 and amd64-only; pinned by digest because the
    # only version tag (v0.1.0) is from 2018.
    image: paulczar/omgwtfssl@sha256:b7b5b9360de8c772f705b7757772782c17a675289d8d1f40d119aae5cbdc917f
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /certs
      name: certs
  volumes:
    - name: certs
      hostPath:
        path: "/home/<someFolderLocation>/certs-pv"
